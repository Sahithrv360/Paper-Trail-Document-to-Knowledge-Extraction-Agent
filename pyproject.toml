[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-agent"
version = "0.1.0"
description = "Local-first business Q&A agent over a knowledge graph"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "openai>=1.30,<3", "PyYAML>=6,<7", "networkx>=3.2,<4", "Jinja2>=3.1,<4", "rapidfuzz>=3.9,<4"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
kg-agent = "kg_agent.cli:main"

[tool.setuptools.packages.find]
include = ["kg_agent*"]

[tool.setuptools.package-data]
kg_agent = ["templates/*.j2"]
